<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: "Source Sans Pro", sans-serif; color: #fafafa; background: transparent; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 15px; padding: 8px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid rgba(250,250,250,.2); background: #262730; color: #fafafa;
  }
  button:hover:not(:disabled) { border-color: #ff4b4b; color: #ff4b4b; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.rec { background: #ff4b4b; border-color: #ff4b4b; color: #fff; }
  #status { font-size: 14px; opacity: .8; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #ff4b4b;
         margin-right: 6px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
</style>
</head>
<body>
  <div class="row">
    <button id="recBtn">🔴 Record live &amp; reply</button>
    <button id="snapBtn">📸 Read my face now</button>
    <span id="status"></span>
  </div>

<script>
// --- Minimal Streamlit component protocol (no build step needed) ---
function send(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*");
}
const setValue = (value) => send("streamlit:setComponentValue", { value, dataType: "json" });
const setHeight = () => send("streamlit:setFrameHeight", { height: document.body.scrollHeight + 4 });

let maxSeconds = 15;
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "streamlit:render") {
    const args = e.data.args || {};
    if (args.max_seconds) maxSeconds = args.max_seconds;
    setHeight();
  }
});
send("streamlit:componentReady", { apiVersion: 1 });

// --- Camera / mic helpers ---
const statusEl = document.getElementById("status");
const recBtn = document.getElementById("recBtn");
const snapBtn = document.getElementById("snapBtn");

function mediaDevices() {
  // Prefer the top-level page (where camera/mic permission was already granted)
  try { return window.parent.navigator.mediaDevices; } catch (_) { return navigator.mediaDevices; }
}

async function getVideoStream() {
  let shared = null;
  try { shared = window.parent.__liveCamStream; } catch (_) {}
  if (shared && shared.active) return shared;
  const s = await mediaDevices().getUserMedia({ video: true, audio: false });
  try { window.parent.__liveCamStream = s; } catch (_) {}
  return s;
}

async function grabFrame(stream, maxSide = 512) {
  const video = document.createElement("video");
  video.muted = true; video.playsInline = true; video.srcObject = stream;
  await video.play();
  await new Promise(r => setTimeout(r, 150));  // let the first frame land
  const scale = Math.min(1, maxSide / Math.max(video.videoWidth, video.videoHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(video.videoWidth * scale);
  c.height = Math.round(video.videoHeight * scale);
  c.getContext("2d").drawImage(video, 0, 0, c.width, c.height);
  video.pause(); video.srcObject = null;
  return c.toDataURL("image/jpeg", 0.85).split(",")[1];
}

const blobToB64 = (blob) => new Promise((res) => {
  const r = new FileReader();
  r.onload = () => res(r.result.split(",")[1]);
  r.readAsDataURL(blob);
});

// --- Face-only snapshot ---
snapBtn.onclick = async () => {
  try {
    snapBtn.disabled = recBtn.disabled = true;
    statusEl.textContent = "Reading your face…";
    const frame = await grabFrame(await getVideoStream());
    setValue({ id: Date.now(), mode: "snap", frames: [frame], audio: null });
    statusEl.textContent = "✓ Sent";
  } catch (err) {
    statusEl.textContent = "⚠️ Camera unavailable: " + err.message;
  } finally {
    snapBtn.disabled = recBtn.disabled = false;
  }
};

// --- Live recording: audio + periodic frames ---
let recorder = null, frames = [], frameTimer = null, tickTimer = null, stopTimer = null, micStream = null;

recBtn.onclick = async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  let vStream;
  try {
    vStream = await getVideoStream();
    micStream = await mediaDevices().getUserMedia({ audio: true, video: false });
  } catch (err) {
    statusEl.textContent = "⚠️ Camera/mic unavailable: " + err.message;
    return;
  }
  frames = [];
  const chunks = [];
  const mime = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
  recorder = new MediaRecorder(micStream, mime ? { mimeType: mime } : undefined);
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = async () => {
    clearInterval(frameTimer); clearInterval(tickTimer); clearTimeout(stopTimer);
    micStream.getTracks().forEach(t => t.stop());
    recBtn.classList.remove("rec");
    recBtn.textContent = "🔴 Record live & reply";
    snapBtn.disabled = false;
    try { frames.push(await grabFrame(vStream)); } catch (_) {}
    statusEl.textContent = "Sending…";
    const audio = chunks.length ? await blobToB64(new Blob(chunks, { type: "audio/webm" })) : null;
    // Keep at most 4 evenly spread frames
    const pick = frames.length <= 4 ? frames
      : [0, 1, 2, 3].map(i => frames[Math.round(i * (frames.length - 1) / 3)]);
    setValue({ id: Date.now(), mode: "live", frames: pick, audio });
    statusEl.textContent = "✓ Sent";
  };

  recorder.start();
  snapBtn.disabled = true;
  recBtn.classList.add("rec");
  recBtn.textContent = "⏹ Stop & send";
  const started = Date.now();
  const tick = () => {
    const s = Math.floor((Date.now() - started) / 1000);
    statusEl.innerHTML = `<span class="dot"></span>Recording… ${s}s / ${maxSeconds}s — talk to me`;
  };
  tick();
  tickTimer = setInterval(tick, 500);
  try { frames.push(await grabFrame(vStream)); } catch (_) {}
  frameTimer = setInterval(async () => { try { frames.push(await grabFrame(vStream)); } catch (_) {} }, 1500);
  stopTimer = setTimeout(() => recorder.state === "recording" && recorder.stop(), maxSeconds * 1000);
};

setHeight();
</script>
</body>
</html>
